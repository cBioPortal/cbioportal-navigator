# Docker Compose for cBioPortal Navigator as a standalone MCP server
#
# Usage:
#   docker compose -f docker-compose.example.yml up -d
#
# The MCP server will be available at:
#   http://localhost:8002/mcp
#
# Authentication modes and production setup: see DEPLOYMENT.md

services:
  cbioportal-navigator:
    # Published image (master); pin a master-<sha> tag for reproducible deploys
    image: ghcr.io/cbioportal/cbioportal-navigator:latest

    # Or build from local source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: cbioportal-navigator

    environment:
      # MCP server configuration
      - MCP_TRANSPORT=http
      - PORT=8002

      # cBioPortal configuration
      - CBIOPORTAL_BASE_URL=https://www.cbioportal.org

      # Private instance: require each caller's cBioPortal token (x-auth-token header)
      # - MCP_AUTH_MODE=header

    ports:
      - "8002:8002"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
